# =============================================================================
# WineGuard Backend - configuração
# Todos os valores sensíveis/ambientais vêm de variáveis de ambiente.
# Veja ../.env.example e docs/backend.md
# =============================================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: wineguard-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wineguard}
    username: ${DATABASE_USERNAME:wineguard}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  task:
    scheduling:
      # monitoramento, simulador, demo e provisionamento rodam em paralelo
      pool:
        size: 4
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wineguard:
  # fiware     -> dados reais via Orion / IoT Agent / STH-Comet (padrão)
  # standalone -> sem FIWARE: só dispositivos virtuais, histórico em memória
  mode: ${WINEGUARD_MODE:fiware}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Intervalo do ciclo de leitura do Orion + avaliação de regras
  telemetry-poll-interval-ms: ${TELEMETRY_POLL_INTERVAL_MS:2000}
  # Cria os 4 dispositivos de exemplo (um por área da vinheria) se o banco estiver vazio
  seed-devices: ${SEED_DEVICES:true}
  # Tempo para reenviar comandos quando o estado reportado pelo ESP32 diverge do desejado
  actuation-resync-seconds: ${ACTUATION_RESYNC_SECONDS:20}

  fiware:
    orion-url: ${FIWARE_ORION_URL:http://localhost:1026}
    sth-url: ${FIWARE_STH_URL:http://localhost:8666}
    iota-url: ${FIWARE_IOTA_URL:http://localhost:4041}
    service: ${FIWARE_SERVICE:smart}
    service-path: ${FIWARE_SERVICE_PATH:/}
    api-key: ${FIWARE_API_KEY:TEF}
    entity-type: ${FIWARE_ENTITY_TYPE:WineSensor}
    # URL do Orion vista PELO IoT Agent (rede interna do Docker)
    iota-cbroker-url: ${FIWARE_IOTA_CBROKER_URL:http://orion:1026}
    # URL do STH-Comet vista PELO Orion (rede interna do Docker)
    sth-notify-url: ${FIWARE_STH_NOTIFY_URL:http://sth-comet:8666/notify}
    # Cria service group, subscription Orion->STH e provisiona dispositivos automaticamente
    auto-provision: ${FIWARE_AUTO_PROVISION:true}
    timeout-ms: ${FIWARE_TIMEOUT_MS:4000}

  mqtt:
    # Usado somente pelos dispositivos virtuais no modo fiware
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

  simulator:
    publish-interval-ms: ${SIMULATOR_PUBLISH_INTERVAL_MS:5000}
